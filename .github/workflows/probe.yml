name: probe
on: push
permissions: {}
jobs:
  fix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: unshare --map-root-user --mount --pid --fork bash -c 'id -u; mount --make-rprivate / && echo mount-ok'
